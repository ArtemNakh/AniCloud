# Передивитися усі логи сервісу 
# docker compose logs -f nameService(redis/ database/ backnest)

# Перевірка статусу контейнера
# docker compose ps

#Підняти контейнер
#docker compose up      (-d без присмотра запускати)

#опустити контейнер
#dokcer compose down       (-v видаляє образ)

# docker compose restart backnest

# Перезапуск із оновленнями
# docker compose up -d --build backnest

services:
  redis:
    image: 'redis:latest'
    container_name: ${REDIS_CONTAINER_NAME}
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data # Збереження кешу при перезапуску  
    healthcheck:
      test: ["CMD","redis-cli","-a" ,"${REDIS_PASSWORD}","ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  database:
    image: mysql
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:  
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5


  backnest:
    restart: on-failure
    build: .
    hostname: backnest
    ports:
      -  "${APPLICATION_PORT}:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
